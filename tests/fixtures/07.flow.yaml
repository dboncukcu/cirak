# Generated by kalfa 0.2.0 (cirak 0.2.0) from configs/07_wgan_gp.yaml: kalfa check --dump, the flow the
# templates of src/kalfa/templates/kalfa.yaml open for the driver document configs/dumps/07.recipe.yaml.
# Regenerate with: uv run python tests/fixtures/regenerate_dumps.py
# Sections: components (the recipe's component tables), blocks (spec and graph blocks as templates;
# the flow blocks are opened inside flow), flow (the expanded flow with every output written out;
# the comments are tezgah's resolution: implicit bindings, pattern matches, derived reads and exports).
components:
  losses:
    wgan_d: {uri: /objective/kalfa/wgan_gp_d, params: {generator: generator, critic: critic, latent: 128, gp_weight: 10, conditional: true}}
    wgan_g: {uri: /objective/kalfa/wgan_g, params: {generator: generator, critic: critic, latent: 128, conditional: true}}
  metrics:
    fid: {uri: /adapter/kalfa/metric, params: {metric: {uri: /metric/kalfa/fid, params: {model: generator.ema, latent: 128, conditional: true, n: 2000}}}}
    samples: {uri: /adapter/kalfa/metric, params: {metric: {uri: /metric/kalfa/sample_writer, params: {sampler: {uri: /generate/kalfa/gan_sampler, params: {
                  model: generator.ema, latent: 128, conditional: true, n_classes: 10, n: 64}}, n: 16}}}}
  triggers: {}
  plots:
    loss_curve: {uri: /plot/kalfa/loss_curve, params: {series: [train/wgan_d, train/wgan_g, val/fid]}}
    samples_gif: {uri: /plot/kalfa/samples_gif}
    samples_matrix: {uri: /plot/kalfa/samples_matrix, params: {n: 8}}
  progress: {uri: /lego/kalfa/progress}
blocks:
  cond_embed:
    variables:
      n_classes:
        required: true
    spec:
    - {uri: /layer/torch/embedding, params: {num: $n_classes$, dim: 64}}
  generator:
    inputs: [z, label]
    outputs: [image]
    graph:
      y: {block: cond_embed, params: {n_classes: 10}, inputs: [label]}
      zy: {uri: /layer/torch/concat, params: {dim: 1}, inputs: [z, y]}
      image: {uri: /layer/dcgan/generator, params: {in_dim: 192, channels: 64}, inputs: [zy]}
  critic:
    inputs: [image, label]
    outputs: [score]
    graph:
      y: {block: cond_embed, params: {n_classes: 10}, inputs: [label]}
      score: {uri: /layer/dcgan/critic, params: {channels: 64, cond_dim: 64}, inputs: [image, y]}
flow:
  outputs: [history, predictions]
  data:  # reads: record; exports: prep, train_loader, valid_loader, test_loader
    source: {uri: /source/kalfa/image_folder, params: {path: data/celeba64}, outputs: [df_0]}
    split: {uri: /split/kalfa/random, params: {ratios: [0.95, 0.05, 0.0], seed: 7}, inputs: {df: df_0}, outputs: {train: train_df_0, valid: valid_df_0, test: 
          test_df_0}}
    set_filter_train: {uri: /lego/kalfa/filter_set, params: {set: train, filters: []}, inputs: {df: train_df_0}, outputs: [train_df]}
    set_filter_valid: {uri: /lego/kalfa/filter_set, params: {set: valid, filters: []}, inputs: {df: valid_df_0}, outputs: [valid_df]}
    set_filter_test: {uri: /lego/kalfa/filter_set, params: {set: test, filters: []}, inputs: {df: test_df_0}, outputs: [test_df]}
    prep: {uri: /lego/kalfa/fit, params: {fields: {image: {preprocessors: [to_signed]}, label: {target: true}}, preprocessors: {to_signed: {uri: 
              /pre/kalfa/to_tensor_signed}}, drop: [], keys: {to_signed: {}}}, inputs: {df: train_df}, outputs: [prep]}  # implicit: record
    frame_train: {uri: /lego/kalfa/apply, params: {set: train, keys: {to_signed: {}}}, inputs: {df: train_df, prep: prep}, outputs: [train_frame]}
    frame_valid: {uri: /lego/kalfa/apply, params: {set: valid, keys: {to_signed: {}}}, inputs: {df: valid_df, prep: prep}, outputs: [valid_frame]}
    frame_test: {uri: /lego/kalfa/apply, params: {set: test, keys: {to_signed: {}}}, inputs: {df: test_df, prep: prep}, outputs: [test_frame]}
    feed_train: {uri: /feed/kalfa/table, inputs: {frame: train_frame, frames: {train: train_frame, valid: valid_frame, test: test_frame}}, outputs: [train_data]}
    feed_valid: {uri: /feed/kalfa/table, inputs: {frame: valid_frame, frames: {train: train_frame, valid: valid_frame, test: test_frame}}, outputs: [valid_data]}
    feed_test: {uri: /feed/kalfa/table, inputs: {frame: test_frame, frames: {train: train_frame, valid: valid_frame, test: test_frame}}, outputs: [test_data]}
    loader_train: {uri: /loader/kalfa/torch, params: {set: train, batch: {size: 64, drop_last: true}}, inputs: {data: train_data}, outputs: [train_loader]}
    loader_valid: {uri: /loader/kalfa/torch, params: {set: valid, batch: {size: 64, drop_last: true}}, inputs: {data: valid_data}, outputs: [valid_loader]}
    loader_test: {uri: /loader/kalfa/torch, params: {set: test, batch: {size: 64, drop_last: true}}, inputs: {data: test_data}, outputs: [test_loader]}
  models: # reads: prep, train_loader; exports: generator, critic, models, emas, composites
    build_generator: {block: generator, builder: /builder/kalfa/module, params: {seed: 7, index: 0, init: {weights: {uri: /init/torch/normal, params: {std: 0.02}}},
        trainable: true, weights: null}, outputs: [generator]}  # implicit: prep, train_loader
    build_critic: {block: critic, builder: /builder/kalfa/module, params: {seed: 7, index: 1, init: {weights: {uri: /init/torch/normal, params: {std: 0.02}}}, 
          trainable: true, weights: null}, outputs: [critic]} # implicit: prep, train_loader
    ema_generator: {uri: /lego/kalfa/clone, params: {decay: 0.999}, inputs: {model: generator}, outputs: [generator_ema]}
    models: {uri: /lego/kalfa/pack, inputs: {items: {generator: generator, critic: critic}}, outputs: [models]}
    emas: {uri: /lego/kalfa/pack, inputs: {items: {generator: generator_ema}}, outputs: [emas]}
    composites: {uri: /lego/kalfa/pack, inputs: {items: {}}, outputs: [composites]}
  optimizers: # reads: critic, generator; exports: optimizers
    build_opt_d: {uri: /optimizer/torch/adam, params: {params: {lr: 0.0001, betas: [0.0, 0.9]}, schedule: null, loss: wgan_d}, inputs: {models: {critic: critic}},
      outputs: [opt_d]}
    build_opt_g: {uri: /optimizer/torch/adam, params: {params: {lr: 0.0001, betas: [0.0, 0.9]}, schedule: null, loss: wgan_g}, inputs: {models: {generator: 
            generator}}, outputs: [opt_g]}
    optimizers: {uri: /lego/kalfa/pack, inputs: {items: {d: opt_d, g: opt_g}}, outputs: [optimizers]}
  training: # reads: models, optimizers, emas, device, composites, train_loader, prep, record, valid_loader, test_loader; exports: history, models_final, optimizers_final, emas_final, counters_final, rules_final
    counters: {uri: /lego/kalfa/const, params: {value: {global_step: 0, turn: 0}}, outputs: [counters]}
    rules: {uri: /lego/kalfa/const, params: {value: {}}, outputs: [rules]}
    init: {uri: /lego/kalfa/init_state, params: {epochs: 100, steps: null}, inputs: {state: {models: models, optimizers: optimizers, emas: emas, counters: 
            counters, rules: rules}}, outputs: [epochs_left]}  # implicit: device
    epochs: # reads: composites, train_loader, device, prep, record, valid_loader, test_loader
      loop:
        carry: [models, optimizers, emas, counters, rules]
        next: _next
        range: epochs_left
        index: turn_index
        until: stop
        trace:
          metrics: history
        outputs:
          models: models_final
          optimizers: optimizers_final
          emas: emas_final
          counters: counters_final
          rules: rules_final
        body:  # reads: rules, models, optimizers, emas, counters, composites, train_loader, device, prep, record, valid_loader, test_loader, turn_index; exports: models_next, optimizers_next, emas_next, counters_next, metrics, rules_next, stop
          effects: {uri: /rule/kalfa/effects, inputs: {rules: rules}, outputs: [effects]}
          turn: {uri: /turn/kalfa/alternating, params: {params: {order: [d, g], steps: {d: 5, g: 1}, fresh_batch: true}, extra: {}, losses: '@losses', metrics: '@metrics',
              losses_keys: {wgan_d: {sets: [train]}, wgan_g: {}}, metrics_keys: {fid: {sets: [valid], every: 5}, samples: {sets: [valid], every: 5}}, predicts: 
                null, steps: null}, inputs: {models: models, optimizers: optimizers, emas: emas, counters: counters, composites: composites, effects: effects, 
                loader: train_loader}, outputs: {models: models_next, optimizers: optimizers_next, emas: emas_next, counters: counters_next, metrics: 
                train_metrics}}  # implicit: device, prep, record
          evaluate_valid: {uri: /lego/kalfa/evaluate, params: {set: valid, losses: '@losses', metrics: '@metrics', losses_keys: {wgan_d: {sets: [train]}, wgan_g: {}},
              metrics_keys: {fid: {sets: [valid], every: 5}, samples: {sets: [valid], every: 5}}, predicts: null}, inputs: {models: models_next, emas: emas_next,
              composites: composites, counters: counters_next, effects: effects, loader: valid_loader}, outputs: [valid_metrics]} # implicit: device, prep, record
          evaluate_test: {uri: /lego/kalfa/evaluate, params: {set: test, losses: '@losses', metrics: '@metrics', losses_keys: {wgan_d: {sets: [train]}, wgan_g: {}},
              metrics_keys: {fid: {sets: [valid], every: 5}, samples: {sets: [valid], every: 5}}, predicts: null}, inputs: {models: models_next, emas: emas_next,
              composites: composites, counters: counters_next, effects: effects, loader: test_loader}, outputs: [test_metrics]} # implicit: device, prep, record
          metrics: {uri: /lego/kalfa/merge, inputs: {parts: '*_metrics'}, outputs: [metrics]} # parts *_metrics: test_metrics, train_metrics, valid_metrics
          rules_0: {uri: /rule/kalfa/open, inputs: {rules: rules}, outputs: [rules_0]}
          rules_ruled: {uri: /lego/kalfa/identity, inputs: {value: rules_0}, outputs: [rules_ruled]}
          stop: {uri: /rule/kalfa/stop, params: {triggers: []}, inputs: {rules: rules_ruled}, outputs: {rules: rules_next, stop: stop}}  # implicit: metrics
          checkpoint: {uri: /lego/kalfa/checkpoint, params: {policy: {uri: /checkpoint/kalfa/best, params: {monitor: val/fid}}}, inputs: {state: '*_next'}, 
              outputs: []} # state *_next: counters_next, emas_next, models_next, optimizers_next, rules_next; implicit: metrics, record
          log: {uri: /lego/kalfa/history, params: {progress: '@progress'}, outputs: []} # implicit: metrics, turn_index, counters_next, optimizers_next, rules_next, record
  after: # reads: models_final, optimizers_final, emas_final, counters_final, rules_final, record, composites, test_loader, prep, device, history, valid_loader; exports: predictions
    final: {uri: /lego/kalfa/save_final, inputs: {models: models_final, optimizers: optimizers_final, emas: emas_final, counters: counters_final, rules: 
          rules_final}, outputs: []}  # implicit: record
    report: {uri: /lego/kalfa/select, params: {which: best}, inputs: {models: models_final, emas: emas_final}, outputs: [selected]} # implicit: record
    predict: {uri: /lego/kalfa/predict, params: {predicts: null, set: test}, inputs: {models: selected, composites: composites, loader: test_loader, prep: prep},
      outputs: [predictions]} # implicit: record, device
    plots: {uri: /lego/kalfa/run_all, params: {plots: '@plots', keys: {loss_curve: {}, samples_gif: {}, samples_matrix: {}}, predicts: null}, inputs: {
          predictions: predictions, history: history, models: selected}, outputs: []} # implicit: record, composites, valid_loader, test_loader
    generate: {uri: /lego/kalfa/generate, params: {generate: {uri: /generate/kalfa/gan_sampler, params: {model: generator.ema, latent: 128, conditional: true, 
              n_classes: 10, n: 64}}}, inputs: {models: selected, composites: composites, prep: prep}, outputs: []} # implicit: record
