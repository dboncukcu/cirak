# Generated by kalfa 0.2.0 (cirak 0.2.0) from examples/alad/config.yaml: kalfa check --dump, the flow the
# templates of src/kalfa/templates/kalfa.yaml open for the driver document configs/dumps/tidy.recipe.yaml.
# Regenerate with: uv run python tests/fixtures/regenerate_dumps.py
# Sections: components (the recipe's component tables), blocks (spec and graph blocks as templates;
# the flow blocks are opened inside flow), flow (the expanded flow with every output written out;
# the comments are tezgah's resolution: implicit bindings, pattern matches, derived reads and exports).
components:
  losses:
    adv_d: {uri: /objective/myexample/alad_discriminator, params: {criterion: {uri: /criterion/kalfa/bce_logits}, latent_dim: 4}}
    adv_g: {uri: /objective/myexample/alad_generator, params: {criterion: {uri: /criterion/kalfa/bce_logits}, latent_dim: 4, feature_matching: 0.0}}
  metrics:
    auroc: {uri: /adapter/kalfa/metric, params: {metric: {uri: /metric/torchmetrics/binary_auroc}}}
    average_precision: {uri: /adapter/kalfa/metric, params: {metric: {uri: /metric/torchmetrics/binary_average_precision}}}
  triggers: {}
  plots:
    score_histogram: {uri: /plot/kalfa/class_histogram}
    roc: {uri: /plot/torchmetrics/binary_roc}
    pr_curve: {uri: /plot/torchmetrics/binary_precision_recall_curve}
    architecture: {uri: /plot/kalfa/architecture}
  progress: {uri: /lego/kalfa/progress}
blocks:
  mlp_hidden:
    variables:
      width:
        required: true
    spec:
    - {uri: /layer/torch/linear, params: {in_features: $width$, out_features: $width$}}
    - {uri: /layer/torch/relu}
  mlp:
    variables:
      in_features:
        required: true
      out_features:
        required: true
      width:
        default: 64
      depth:
        default: 2
    inputs: [x]
    outputs: [y]
    graph:
      h0: {uri: /layer/torch/linear, params: {in_features: $in_features$, out_features: $width$}, inputs: [x]}
      a0: {uri: /layer/torch/relu, inputs: [h0]}
      h: {block: mlp_hidden, params: {width: $width$}, inputs: [a0], repeat: $depth$}
      j: {uri: /layer/torch/concat, params: {dim: 1}, inputs: [x, h]}
      y: {uri: /layer/kalfa/linear, params: {out_features: $out_features$}, inputs: [j]}
  branch:
    variables:
      in_features:
        required: true
      width:
        required: true
    spec:
    - {uri: /layer/torch/linear, params: {in_features: $in_features$, out_features: $width$}}
    - {uri: /layer/torch/leaky_relu, params: {negative_slope: 0.2}}
  head:
    variables:
      in_features:
        required: true
      width:
        required: true
    inputs: [c]
    outputs: [feature, logit]
    graph:
      h: {uri: /layer/torch/linear, params: {in_features: $in_features$, out_features: $width$}, inputs: [c]}
      feature: {uri: /layer/torch/leaky_relu, params: {negative_slope: 0.2}, inputs: [h]}
      d: {uri: /layer/torch/dropout, params: {p: 0.2}, inputs: [feature]}
      logit: {uri: /layer/torch/linear, params: {in_features: $width$, out_features: 1}, inputs: [d]}
  encoder:
    inputs: [x]
    outputs: [z]
    spec:
    - {block: mlp, params: {in_features: 6, out_features: 64, width: 64, depth: 2}}
    - {uri: /layer/torch/leaky_relu, params: {negative_slope: 0.2}}
    - {uri: /layer/torch/linear, params: {in_features: 64, out_features: 4}}
  generator:
    inputs: [z]
    outputs: [x_hat]
    spec:
    - {uri: /layer/torch/linear, params: {in_features: 4, out_features: 64}}
    - {uri: /layer/torch/relu}
    - {uri: /layer/torch/linear, params: {in_features: 64, out_features: 64}}
    - {uri: /layer/torch/relu}
    - {uri: /layer/torch/linear, params: {in_features: 64, out_features: 6}}
  dxz:
    inputs: [x, z]
    outputs: [logit]
    graph:
      xb: {block: branch, params: {in_features: 6, width: 32}, inputs: [x]}
      zb: {block: branch, params: {in_features: 4, width: 32}, inputs: [z]}
      j: {uri: /layer/torch/concat, params: {dim: 1}, inputs: [xb, zb]}
      head: {block: head, params: {in_features: 64, width: 64}, inputs: [j], outputs: [feature, logit]}
  dxx:
    inputs: [x, x_hat]
    outputs: [logit, feature]
    graph:
      j: {uri: /layer/torch/concat, params: {dim: 1}, inputs: [x, x_hat]}
      head: {block: head, params: {in_features: 12, width: 64}, inputs: [j], outputs: [feature, logit]}
  dzz:
    inputs: [z, z_hat]
    outputs: [logit]
    graph:
      j: {uri: /layer/torch/concat, params: {dim: 1}, inputs: [z, z_hat]}
      head: {block: head, params: {in_features: 8, width: 32}, inputs: [j], outputs: [feature, logit]}
  anomaly_score:
    inputs: [x]
    outputs: [score]
    graph:
      z: {model: encoder, inputs: [x]}
      x_hat: {model: generator, inputs: [z]}
      rec: {model: dxx, inputs: [x, x_hat], outputs: [logit_rec, feature_rec]}
      ref: {model: dxx, inputs: [x, x], outputs: [logit_ref, feature_ref]}
      score: {uri: /layer/kalfa/l1_distance, inputs: [feature_rec, feature_ref]}
flow:
  outputs: [history, predictions]
  data:  # reads: record; exports: prep, train_loader, valid_loader, test_loader
    source: {uri: /source/kalfa/parquet, params: {path: anomaly_data.parquet}, outputs: [df_0]}
    pre_1: {uri: /lego/kalfa/filter, params: {query: (is_anomaly > -4) & (is_anomaly < 4)}, inputs: {df: df_0}, outputs: [df_1]}
    split: {uri: /split/kalfa/random, params: {ratios: [0.7, 0.1, 0.2], seed: 42}, inputs: {df: df_1}, outputs: {train: train_df_0, valid: valid_df_0, test: 
          test_df_0}}
    set_filter_train: {uri: /lego/kalfa/filter_set, params: {set: train, filters: [{query: is_anomaly == 0, sets: [train]}]}, inputs: {df: train_df_0}, outputs: [
        train_df]}
    set_filter_valid: {uri: /lego/kalfa/filter_set, params: {set: valid, filters: [{query: is_anomaly == 0, sets: [train]}]}, inputs: {df: valid_df_0}, outputs: [
        valid_df]}
    set_filter_test: {uri: /lego/kalfa/filter_set, params: {set: test, filters: [{query: is_anomaly == 0, sets: [train]}]}, inputs: {df: test_df_0}, outputs: [
          test_df]}
    prep: {uri: /lego/kalfa/fit, params: {fields: {x?: {preprocessors: [abs_scaler, log_scaler, std_scaler]}, xx*: {preprocessors: [abs_scaler, log_scaler, 
                std_scaler]}, is_anomaly: {target: true, preprocessors: [cast_int]}}, preprocessors: {abs_scaler: {uri: /pre/kalfa/abs}, log_scaler: {uri: 
              /pre/kalfa/log, params: {base: 10, norm: 1200}}, std_scaler: {uri: /pre/sklearn/standard_scaler}, cast_int: {uri: /pre/kalfa/cast, params: {dtype: 
                int}}}, drop: [xx6, xx7], keys: {abs_scaler: {}, log_scaler: {}, std_scaler: {}, cast_int: {}}}, inputs: {df: train_df}, outputs: [prep]}  # implicit: record
    frame_train: {uri: /lego/kalfa/apply, params: {set: train, keys: {abs_scaler: {}, log_scaler: {}, std_scaler: {}, cast_int: {}}}, inputs: {df: train_df, 
          prep: prep}, outputs: [train_frame]}
    frame_valid: {uri: /lego/kalfa/apply, params: {set: valid, keys: {abs_scaler: {}, log_scaler: {}, std_scaler: {}, cast_int: {}}}, inputs: {df: valid_df, 
          prep: prep}, outputs: [valid_frame]}
    frame_test: {uri: /lego/kalfa/apply, params: {set: test, keys: {abs_scaler: {}, log_scaler: {}, std_scaler: {}, cast_int: {}}}, inputs: {df: test_df, prep: 
          prep}, outputs: [test_frame]}
    feed_train: {uri: /feed/kalfa/table, inputs: {frame: train_frame, frames: {train: train_frame, valid: valid_frame, test: test_frame}}, outputs: [train_data]}
    feed_valid: {uri: /feed/kalfa/table, inputs: {frame: valid_frame, frames: {train: train_frame, valid: valid_frame, test: test_frame}}, outputs: [valid_data]}
    feed_test: {uri: /feed/kalfa/table, inputs: {frame: test_frame, frames: {train: train_frame, valid: valid_frame, test: test_frame}}, outputs: [test_data]}
    loader_train: {uri: /loader/kalfa/torch, params: {set: train, batch: {size: 50}}, inputs: {data: train_data}, outputs: [train_loader]}
    loader_valid: {uri: /loader/kalfa/torch, params: {set: valid, batch: {size: 50}}, inputs: {data: valid_data}, outputs: [valid_loader]}
    loader_test: {uri: /loader/kalfa/torch, params: {set: test, batch: {size: 50}}, inputs: {data: test_data}, outputs: [test_loader]}
  models: # reads: prep, train_loader; exports: encoder, generator, dxz, dxx, dzz, models, emas, composites
    build_encoder: {block: encoder, builder: /builder/kalfa/module, params: {seed: 42, index: 0, init: null, trainable: true, weights: null}, outputs: [encoder]}  # implicit: prep, train_loader
    build_generator: {block: generator, builder: /builder/kalfa/module, params: {seed: 42, index: 1, init: {weights: {uri: /init/torch/normal, params: {std: 
                0.02}}}, trainable: true, weights: null}, outputs: [generator]} # implicit: prep, train_loader
    build_dxz: {block: dxz, builder: /builder/kalfa/module, params: {seed: 42, index: 2, init: {weights: {uri: /init/torch/normal, params: {std: 0.02}}}, 
          trainable: true, weights: null}, outputs: [dxz]} # implicit: prep, train_loader
    build_dxx: {block: dxx, builder: /builder/kalfa/module, params: {seed: 42, index: 3, init: {weights: {uri: /init/torch/normal, params: {std: 0.02}}}, 
          trainable: true, weights: null}, outputs: [dxx]} # implicit: prep, train_loader
    build_dzz: {block: dzz, builder: /builder/kalfa/module, params: {seed: 42, index: 4, init: {weights: {uri: /init/torch/normal, params: {std: 0.02}}}, 
          trainable: true, weights: null}, outputs: [dzz]} # implicit: prep, train_loader
    models: {uri: /lego/kalfa/pack, inputs: {items: {encoder: encoder, generator: generator, dxz: dxz, dxx: dxx, dzz: dzz}}, outputs: [models]}
    emas: {uri: /lego/kalfa/pack, inputs: {items: {}}, outputs: [emas]}
    compose_anomaly_score: {block: anomaly_score, builder: /builder/kalfa/module, inputs: {models: models}, outputs: [anomaly_score]} # implicit: prep, train_loader
    composites: {uri: /lego/kalfa/pack, inputs: {items: {anomaly_score: anomaly_score}}, outputs: [composites]}
  optimizers: # reads: encoder, generator, dxz, dxx, dzz; exports: optimizers
    build_opt_g: {uri: /optimizer/torch/adam, params: {params: {lr: 0.0002, betas: [0.5, 0.999]}, schedule: null, loss: adv_g}, inputs: {models: {encoder: 
            encoder, generator: generator}}, outputs: [opt_g]}
    build_opt_d: {uri: /optimizer/torch/adam, params: {params: {lr: 0.0002, betas: [0.5, 0.999]}, schedule: null, loss: adv_d}, inputs: {models: {dxz: dxz, dxx: 
            dxx, dzz: dzz}}, outputs: [opt_d]}
    optimizers: {uri: /lego/kalfa/pack, inputs: {items: {g: opt_g, d: opt_d}}, outputs: [optimizers]}
  training: # reads: models, optimizers, emas, device, composites, train_loader, prep, record, valid_loader, test_loader; exports: history, models_final, optimizers_final, emas_final, counters_final, rules_final
    counters: {uri: /lego/kalfa/const, params: {value: {global_step: 0, turn: 0}}, outputs: [counters]}
    rules: {uri: /lego/kalfa/const, params: {value: {}}, outputs: [rules]}
    init: {uri: /lego/kalfa/init_state, params: {epochs: 60, steps: null}, inputs: {state: {models: models, optimizers: optimizers, emas: emas, counters: 
            counters, rules: rules}}, outputs: [epochs_left]}  # implicit: device
    epochs: # reads: composites, train_loader, device, prep, record, valid_loader, test_loader
      loop:
        carry: [models, optimizers, emas, counters, rules]
        next: _next
        range: epochs_left
        index: turn_index
        until: stop
        trace:
          metrics: history
        outputs:
          models: models_final
          optimizers: optimizers_final
          emas: emas_final
          counters: counters_final
          rules: rules_final
        body:  # reads: rules, models, optimizers, emas, counters, composites, train_loader, device, prep, record, valid_loader, test_loader, turn_index; exports: models_next, optimizers_next, emas_next, counters_next, metrics, rules_next, stop
          effects: {uri: /rule/kalfa/effects, inputs: {rules: rules}, outputs: [effects]}
          turn: {uri: /turn/kalfa/alternating, params: {params: {order: [d, g], steps: {d: 1, g: 1}}, extra: {}, losses: '@losses', metrics: '@metrics', 
                losses_keys: {adv_d: {}, adv_g: {}}, metrics_keys: {auroc: {}, average_precision: {}}, predicts: anomaly_score, steps: null}, inputs: {models: 
                models, optimizers: optimizers, emas: emas, counters: counters, composites: composites, effects: effects, loader: train_loader}, outputs: {
                models: models_next, optimizers: optimizers_next, emas: emas_next, counters: counters_next, metrics: train_metrics}}  # implicit: device, prep, record
          evaluate_valid: {uri: /lego/kalfa/evaluate, params: {set: valid, losses: '@losses', metrics: '@metrics', losses_keys: {adv_d: {}, adv_g: {}}, 
                metrics_keys: {auroc: {}, average_precision: {}}, predicts: anomaly_score}, inputs: {models: models_next, emas: emas_next, composites: 
                composites, counters: counters_next, effects: effects, loader: valid_loader}, outputs: [valid_metrics]} # implicit: device, prep, record
          evaluate_test: {uri: /lego/kalfa/evaluate, params: {set: test, losses: '@losses', metrics: '@metrics', losses_keys: {adv_d: {}, adv_g: {}}, 
                metrics_keys: {auroc: {}, average_precision: {}}, predicts: anomaly_score}, inputs: {models: models_next, emas: emas_next, composites: 
                composites, counters: counters_next, effects: effects, loader: test_loader}, outputs: [test_metrics]} # implicit: device, prep, record
          metrics: {uri: /lego/kalfa/merge, inputs: {parts: '*_metrics'}, outputs: [metrics]} # parts *_metrics: test_metrics, train_metrics, valid_metrics
          rules_0: {uri: /rule/kalfa/open, inputs: {rules: rules}, outputs: [rules_0]}
          rules_ruled: {uri: /lego/kalfa/identity, inputs: {value: rules_0}, outputs: [rules_ruled]}
          stop: {uri: /rule/kalfa/stop, params: {triggers: []}, inputs: {rules: rules_ruled}, outputs: {rules: rules_next, stop: stop}}  # implicit: metrics
          checkpoint: {uri: /lego/kalfa/checkpoint, params: {policy: null}, inputs: {state: '*_next'}, outputs: []} # state *_next: counters_next, emas_next, models_next, optimizers_next, rules_next; implicit: metrics, record
          log: {uri: /lego/kalfa/history, params: {progress: '@progress'}, outputs: []} # implicit: metrics, turn_index, counters_next, optimizers_next, rules_next, record
  after: # reads: models_final, optimizers_final, emas_final, counters_final, rules_final, record, composites, test_loader, prep, device, history, valid_loader; exports: predictions
    final: {uri: /lego/kalfa/save_final, inputs: {models: models_final, optimizers: optimizers_final, emas: emas_final, counters: counters_final, rules: 
          rules_final}, outputs: []}  # implicit: record
    report: {uri: /lego/kalfa/select, params: {which: last}, inputs: {models: models_final, emas: emas_final}, outputs: [selected]} # implicit: record
    predict: {uri: /lego/kalfa/predict, params: {predicts: anomaly_score, set: test}, inputs: {models: selected, composites: composites, loader: test_loader, 
          prep: prep}, outputs: [predictions]} # implicit: record, device
    plots: {uri: /lego/kalfa/run_all, params: {plots: '@plots', keys: {score_histogram: {}, roc: {}, pr_curve: {}, architecture: {}}, predicts: anomaly_score}, 
        inputs: {predictions: predictions, history: history, models: selected}, outputs: []} # implicit: record, composites, valid_loader, test_loader
    generate: {uri: /lego/kalfa/generate, params: {generate: null}, inputs: {models: selected, composites: composites, prep: prep}, outputs: []} # implicit: record
