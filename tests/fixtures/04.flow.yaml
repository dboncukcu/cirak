# Regenerate with: uv run python tests/fixtures/regenerate_dumps.py
# Sections: components (the recipe's component tables), blocks (spec and graph blocks as templates;
# the flow blocks are opened inside flow), flow (the expanded flow with every output written out;
# the comments are tezgah's resolution: implicit bindings, pattern matches, derived reads and exports).
components:
  losses:
    ce: {uri: /adapter/kalfa/criterion, params: {criterion: {uri: /criterion/kalfa/cross_entropy}}}
  metrics:
    accuracy: {uri: /adapter/kalfa/metric, params: {metric: {uri: /metric/torchmetrics/accuracy}}}
  triggers:
    unfreeze: {uri: /trigger/kalfa/after_turn, params: {at: 5}}
    stop_0: {uri: /trigger/kalfa/plateau, params: {monitor: val/accuracy, mode: max, patience: 4}}
  plots:
    loss_curve: {uri: /plot/kalfa/loss_curve}
    confusion: {uri: /plot/kalfa/confusion_matrix}
  progress: {uri: /lego/kalfa/progress}
blocks:
  backbone:
    inputs: [image]
    outputs: [feature]
    spec:
    - {uri: /layer/timm/timm_backbone, params: {name: resnet50, pretrained: true, pooled: true}}
  head:
    inputs: [feature]
    outputs: [logits]
    spec:
    - {uri: /layer/kalfa/linear, params: {out_features: 37}}
  classifier:
    inputs: [image]
    outputs: [logits]
    graph:
      feature: {model: backbone, inputs: [image]}
      logits: {model: head, inputs: [feature]}
flow:
  outputs: [history, predictions]
  data:  # reads: record; exports: prep, train_loader, valid_loader, test_loader
    source: {uri: /source/kalfa/image_folder, params: {path: data/pets}, outputs: [df_0]}
    split: {uri: /split/kalfa/random, params: {ratios: [0.9, 0.1, 0.0], seed: 7}, inputs: {df: df_0}, outputs: {train: train_df_0, valid: valid_df_0, test: 
          test_df_0}}
    set_filter_train: {uri: /lego/kalfa/filter_set, params: {set: train, filters: []}, inputs: {df: train_df_0}, outputs: [train_df]}
    set_filter_valid: {uri: /lego/kalfa/filter_set, params: {set: valid, filters: []}, inputs: {df: valid_df_0}, outputs: [valid_df]}
    set_filter_test: {uri: /lego/kalfa/filter_set, params: {set: test, filters: []}, inputs: {df: test_df_0}, outputs: [test_df]}
    prep: {uri: /lego/kalfa/fit, params: {fields: {image: {preprocessors: [resize, augment, to_tensor, normalize]}, label: {target: true}}, preprocessors: {
            resize: {uri: /pre/kalfa/resize, params: {size: 224}}, to_tensor: {uri: /pre/kalfa/to_tensor}, augment: {uri: /pre/kalfa/random_crop_flip, params: {
                size: 224}}, normalize: {uri: /pre/kalfa/normalize, params: {mean: imagenet, std: imagenet}}}, drop: [], keys: {resize: {}, to_tensor: {}, 
            augment: {sets: [train]}, normalize: {}}}, inputs: {df: train_df}, outputs: [prep]}  # implicit: record
    frame_train: {uri: /lego/kalfa/apply, params: {set: train, keys: {resize: {}, to_tensor: {}, augment: {sets: [train]}, normalize: {}}}, inputs: {df: 
          train_df, prep: prep}, outputs: [train_frame]}
    frame_valid: {uri: /lego/kalfa/apply, params: {set: valid, keys: {resize: {}, to_tensor: {}, augment: {sets: [train]}, normalize: {}}}, inputs: {df: 
          valid_df, prep: prep}, outputs: [valid_frame]}
    frame_test: {uri: /lego/kalfa/apply, params: {set: test, keys: {resize: {}, to_tensor: {}, augment: {sets: [train]}, normalize: {}}}, inputs: {df: test_df, 
          prep: prep}, outputs: [test_frame]}
    feed_train: {uri: /feed/kalfa/table, inputs: {frame: train_frame, frames: {train: train_frame, valid: valid_frame, test: test_frame}}, outputs: [train_data]}
    feed_valid: {uri: /feed/kalfa/table, inputs: {frame: valid_frame, frames: {train: train_frame, valid: valid_frame, test: test_frame}}, outputs: [valid_data]}
    feed_test: {uri: /feed/kalfa/table, inputs: {frame: test_frame, frames: {train: train_frame, valid: valid_frame, test: test_frame}}, outputs: [test_data]}
    loader_train: {uri: /loader/kalfa/torch, params: {set: train, batch: {size: 64, eval_size: 256, balanced: true}}, inputs: {data: train_data}, outputs: [
          train_loader]}
    loader_valid: {uri: /loader/kalfa/torch, params: {set: valid, batch: {size: 64, eval_size: 256, balanced: true}}, inputs: {data: valid_data}, outputs: [
          valid_loader]}
    loader_test: {uri: /loader/kalfa/torch, params: {set: test, batch: {size: 64, eval_size: 256, balanced: true}}, inputs: {data: test_data}, outputs: [
          test_loader]}
  models: # reads: prep, train_loader; exports: backbone, head, models, emas, composites
    build_backbone: {block: backbone, builder: /builder/kalfa/module, params: {seed: 7, index: 0, init: null, trainable: false, weights: null}, outputs: [
          backbone]}  # implicit: prep, train_loader
    build_head: {block: head, builder: /builder/kalfa/module, params: {seed: 7, index: 1, init: null, trainable: true, weights: null}, outputs: [head]} # implicit: prep, train_loader
    models: {uri: /lego/kalfa/pack, inputs: {items: {backbone: backbone, head: head}}, outputs: [models]}
    emas: {uri: /lego/kalfa/pack, inputs: {items: {}}, outputs: [emas]}
    compose_classifier: {block: classifier, builder: /builder/kalfa/module, inputs: {models: models}, outputs: [classifier]} # implicit: prep, train_loader
    composites: {uri: /lego/kalfa/pack, inputs: {items: {classifier: classifier}}, outputs: [composites]}
  optimizers: # reads: backbone, head; exports: optimizers
    build_opt_main: {uri: /optimizer/torch/adamw, params: {params: {lr: 0.001, groups: [{match: backbone.*, lr: 1e-05}]}, schedule: null, loss: ce}, inputs: {
          models: {backbone: backbone, head: head}}, outputs: [opt_main]}
    optimizers: {uri: /lego/kalfa/pack, inputs: {items: {main: opt_main}}, outputs: [optimizers]}
  training: # reads: models, optimizers, emas, device, composites, train_loader, prep, record, valid_loader, test_loader; exports: history, models_final, optimizers_final, emas_final, counters_final, rules_final
    counters: {uri: /lego/kalfa/const, params: {value: {global_step: 0, turn: 0}}, outputs: [counters]}
    rules: {uri: /lego/kalfa/const, params: {value: {}}, outputs: [rules]}
    init: {uri: /lego/kalfa/init_state, params: {epochs: 20, steps: null}, inputs: {state: {models: models, optimizers: optimizers, emas: emas, counters: 
            counters, rules: rules}}, outputs: [epochs_left]}  # implicit: device
    epochs: # reads: composites, train_loader, device, prep, record, valid_loader, test_loader
      loop:
        carry: [models, optimizers, emas, counters, rules]
        next: _next
        range: epochs_left
        index: turn_index
        until: stop
        trace:
          metrics: history
        outputs:
          models: models_final
          optimizers: optimizers_final
          emas: emas_final
          counters: counters_final
          rules: rules_final
        body:  # reads: rules, models, optimizers, emas, counters, composites, train_loader, device, prep, record, valid_loader, test_loader, turn_index; exports: models_next, optimizers_next, emas_next, counters_next, metrics, rules_next, stop
          effects: {uri: /rule/kalfa/effects, inputs: {rules: rules}, outputs: [effects]}
          turn: {uri: /turn/kalfa/alternating, params: {params: {}, extra: {}, losses: '@losses', metrics: '@metrics', losses_keys: {ce: {}}, metrics_keys: {
                  accuracy: {}}, predicts: classifier, steps: null}, inputs: {models: models, optimizers: optimizers, emas: emas, counters: counters, composites: 
                composites, effects: effects, loader: train_loader}, outputs: {models: models_next, optimizers: optimizers_next, emas: emas_next, counters: 
                counters_next, metrics: train_metrics}}  # implicit: device, prep, record
          evaluate_valid: {uri: /lego/kalfa/evaluate, params: {set: valid, losses: '@losses', metrics: '@metrics', losses_keys: {ce: {}}, metrics_keys: {
                  accuracy: {}}, predicts: classifier}, inputs: {models: models_next, emas: emas_next, composites: composites, counters: counters_next, effects: 
                effects, loader: valid_loader}, outputs: [valid_metrics]} # implicit: device, prep, record
          evaluate_test: {uri: /lego/kalfa/evaluate, params: {set: test, losses: '@losses', metrics: '@metrics', losses_keys: {ce: {}}, metrics_keys: {accuracy: {}},
              predicts: classifier}, inputs: {models: models_next, emas: emas_next, composites: composites, counters: counters_next, effects: effects, loader: 
                test_loader}, outputs: [test_metrics]} # implicit: device, prep, record
          metrics: {uri: /lego/kalfa/merge, inputs: {parts: '*_metrics'}, outputs: [metrics]} # parts *_metrics: test_metrics, train_metrics, valid_metrics
          rules_0: {uri: /rule/kalfa/open, inputs: {rules: rules}, outputs: [rules_0]}
          rule_1: {uri: /rule/kalfa/rule, params: {name: unfreeze, when: '@triggers.unfreeze', set: {backbone.trainable: true}, after: null}, inputs: {rules: 
                rules_0}, outputs: [rules_1]}  # implicit: metrics, turn_index
          rules_ruled: {uri: /lego/kalfa/identity, inputs: {value: rules_1}, outputs: [rules_ruled]}
          stop: {uri: /rule/kalfa/stop, params: {triggers: ['@triggers.stop_0']}, inputs: {rules: rules_ruled}, outputs: {rules: rules_next, stop: stop}}  # implicit: metrics
          checkpoint: {uri: /lego/kalfa/checkpoint, params: {policy: {uri: /checkpoint/kalfa/best, params: {monitor: val/accuracy, mode: max}}}, inputs: {state: '*_next'},
            outputs: []} # state *_next: counters_next, emas_next, models_next, optimizers_next, rules_next; implicit: metrics, record
          log: {uri: /lego/kalfa/history, params: {progress: '@progress'}, outputs: []} # implicit: metrics, turn_index, counters_next, optimizers_next, rules_next, record
  after: # reads: models_final, optimizers_final, emas_final, counters_final, rules_final, record, composites, test_loader, prep, device, history, valid_loader; exports: predictions
    final: {uri: /lego/kalfa/save_final, inputs: {models: models_final, optimizers: optimizers_final, emas: emas_final, counters: counters_final, rules: 
          rules_final}, outputs: []}  # implicit: record
    report: {uri: /lego/kalfa/select, params: {which: best}, inputs: {models: models_final, emas: emas_final}, outputs: [selected]} # implicit: record
    predict: {uri: /lego/kalfa/predict, params: {predicts: classifier, set: test}, inputs: {models: selected, composites: composites, loader: test_loader, prep: 
          prep}, outputs: [predictions]} # implicit: record, device
    plots: {uri: /lego/kalfa/run_all, params: {plots: '@plots', keys: {loss_curve: {}, confusion: {}}, predicts: classifier}, inputs: {predictions: predictions, 
          history: history, models: selected}, outputs: []} # implicit: record, composites, valid_loader, test_loader
    generate: {uri: /lego/kalfa/generate, params: {generate: null}, inputs: {models: selected, composites: composites, prep: prep}, outputs: []} # implicit: record
